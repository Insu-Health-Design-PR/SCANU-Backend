[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weapon-backend"
version = "0.1.0"
description = "Weapon detection backend API and inference services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "torch",
    "ultralytics",
    "mediapipe>=0.10.14",
    "aiortc",
    "PyYAML>=6.0",
    "pyserial>=3.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "apps*", "services*", "runtime*", "media*", "weapon_ai*", "utils*", "lab*", "layer1_sensor_hub*", "layer8_ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
